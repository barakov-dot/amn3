[project]
name = "amneziya"
version = "0.1.0"
description = "Telegram-managed AmneziaWG access automation"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.4,<4",
  "cryptography>=42,<46",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "PyYAML>=6,<7",
  "qrcode[pil]>=7,<9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
