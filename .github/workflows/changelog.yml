name: Changelog gate

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  changelog:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, pinned 2026-09-20
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test the gate on disposable repositories
        run: python3 -m unittest discover -s tests -p test_changelog_gate.py -v
      - name: Check every new commit
        run: python3 scripts/check_changelog.py --range "$BASE_SHA" "$HEAD_SHA"
