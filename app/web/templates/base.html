<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} | Amneziya Admin</title>
    <link rel="stylesheet" href="/static/admin.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">Amneziya Admin</a>
      {% if authenticated %}
        <nav class="nav" aria-label="Основная навигация">
          <a class="nav-link" href="/">Обзор</a>
          <a class="nav-link" href="/users">Пользователи</a>
          <a class="nav-link" href="/servers">Servers</a>
          <a class="nav-link" href="/api-readiness">API</a>
          <a class="nav-link" href="/integration-status">Integration</a>
          <a class="nav-link" href="/about">About</a>
          <a class="nav-link" href="/api-tokens">Tokens</a>
          <a class="nav-link" href="/orders">Orders</a>
          <a class="nav-link" href="/config-templates">Шаблоны</a>
          <span class="nav-link nav-link-disabled">Email</span>
          <a class="nav-link" href="/logs">Logs</a>
          <a class="nav-link" href="/settings">Settings</a>
        </nav>
        <form action="/logout" method="post" class="logout-form">
          <input name="csrf_token" type="hidden" value="{{ csrf_token }}">
          <button class="button button-secondary" type="submit">Выйти</button>
        </form>
      {% endif %}
    </header>

    <main class="page">
      {% block content %}{% endblock %}
    </main>
    <script>
      document.addEventListener("submit", function (event) {
        const form = event.target;
        if (!(form instanceof HTMLFormElement)) {
          return;
        }
        const message = form.dataset.confirm;
        if (message && !window.confirm(message)) {
          event.preventDefault();
        }
      });
    </script>
  </body>
</html>
