<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} | Amneziya Admin</title>
    <link rel="stylesheet" href="/static/admin.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <img class="brand-mark" src="/static/brand-mark.jpg" alt="" width="32" height="32">
        <span>Amneziya Admin</span>
      </a>
      {% if authenticated %}
        <nav class="nav" aria-label="Основная навигация">
          <a class="nav-link" href="/">Обзор</a>
          <a class="nav-link" href="/users">Пользователи</a>
          <a class="nav-link" href="/servers">Servers</a>
          <a class="nav-link" href="/orders">Orders</a>
          <a class="nav-link" href="/config-templates">Шаблоны</a>
          <span class="nav-link nav-link-disabled">Email</span>
          <a class="nav-link" href="/logs">Logs</a>
          <a class="nav-link" href="/settings">Settings</a>
        </nav>
        <form action="/logout" method="post" class="logout-form">
          <input name="csrf_token" type="hidden" value="{{ csrf_token }}">
          <button class="button button-secondary" type="submit">Выйти</button>
        </form>
      {% endif %}
    </header>

    {% if authenticated %}
      <div class="brand-masthead" aria-label="Необъятная.net"></div>
    {% endif %}

    <main class="page">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
