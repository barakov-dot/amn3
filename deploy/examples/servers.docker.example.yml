servers:
  - name: debian-vps-1
    enabled: true
    location: default
    ssh:
      host: CHANGE_ME_SERVER_IP_OR_DOMAIN
      port: 22
      user: root
      auth:
        type: key
        private_key_path: /root/.ssh/id_ed25519
    vpn:
      endpoint_host: CHANGE_ME_PUBLIC_IP_OR_DOMAIN
      port: 30001
      interface: awg0
      network_cidr: 10.8.0.0/24
      server_address: 10.8.0.1/24
      dns: 1.1.1.1
      allowed_ips: 0.0.0.0/0
      max_devices: 254
      server_public_key: CHANGE_ME_AWG_SERVER_PUBLIC_KEY
    firewall:
      provider: ufw
      open_vpn_port: true
    runtime:
      type: docker
      container_name: amnezia-awg
